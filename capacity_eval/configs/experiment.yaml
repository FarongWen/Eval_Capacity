data:
  mmlu_pro: ../dataset/mmlu_pro
  agieval: ../dataset/agieval
  mmbench: ../dataset/MMBench
  mmmu_pro: ../dataset/mmmu_pro

output_dir: ./outputs
random_seed: 42

calibration:
  repeats: 5
  epsilon: 1e-8

validation:
  repeats: 1

exp53:
  target_levels: [0.1, 0.2, 0.3]
  tolerance: 0.10
  fallback_tolerance: 0.15
  subset_types: ["min_k", "large_k"]

benchmarks:
  llm: ["mmlu_pro", "agieval"]
  lmm: ["mmmu_pro", "mmbench"]
