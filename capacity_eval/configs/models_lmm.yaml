models:
  # --- calibration models (3) ---

  - name: gpt-4o-v
    type: api
    provider: openai
    model_id: gpt-4o
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com/v1/
    temperature: 0.2
    max_tokens: 10
